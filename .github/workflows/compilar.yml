name: Compilar Motionex

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Versión original (vacío: la última)"
        type: string
        default: ""
      publicar:
        description: "Publicar la versión"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  compilar:
    uses: jacnexstudio/jacnex-build/.github/workflows/compilar-windows.yml@main
    with:
      proyecto: effectcraft
      upstream: storytold/effectcraft
      nombre: Motionex
      ref: ${{ inputs.ref }}
      publicar: ${{ inputs.publicar }}
